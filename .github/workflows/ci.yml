# Integración continua del frontend, en cada subida y pull request:
# formato, lint, tipos, la compilación de Cloudflare y vulnerabilidades
# conocidas en las librerías que llegan al navegador.
#
# El e2e (Playwright) necesita el backend, que vive en un repositorio
# privado: lo pasa cada noche la CI de ese repositorio, con este `main`.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Formato
        run: npx prettier --check .
      - name: Lint
        run: npx eslint .
      - name: Tipos
        run: npx tsc --noEmit -p .
      - name: Compilación
        env:
          # La URL real de la API se pone en Cloudflare; aquí solo se
          # comprueba que compila.
          TEAMSUP_ALLOW_NO_API_URL: "1"
        run: npm run build
      - name: El service worker llega al despliegue
        # Cloudflare sirve .output/public. Si sw.js falta, o no precarga la
        # app, no hay app instalable ni notificaciones push (ver vite.config.ts).
        run: |
          test -f .output/public/sw.js || { echo "::error::Falta .output/public/sw.js"; exit 1; }
          n=$(grep -o 'url:"' .output/public/sw.js | wc -l)
          echo "sw.js precarga $n ficheros"
          [ "$n" -gt 50 ] || { echo "::error::sw.js solo precarga $n ficheros"; exit 1; }
      - name: Vulnerabilidades
        run: npm audit --omit=dev --audit-level=high
